name: Build FreeTube TV (Fire TV APK)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream-Release-Tag (leer = neuestes Release, z. B. 0.25.3.1) oder Branch"
        required: false
        default: ""
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: write   # für das Release am Ende

env:
  UPSTREAM_REPO: MarmadileManteater/FreeTubeAndroid

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kit auschecken
        uses: actions/checkout@v4

      - name: Upstream-Version bestimmen (neuestes Release-Tag)
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            # Release-Tags von FreeTube Android haben die Form 0.25.3.1
            ref=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" \
                  | sed 's@.*refs/tags/@@' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V | tail -1)
          fi
          [ -n "$ref" ] || { echo "::error::Kein Upstream-Release-Tag gefunden"; exit 1; }
          # Versionsnummer nur setzen, wenn ref wie eine Release-Version aussieht
          if echo "$ref" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version=$ref" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Upstream-Ref: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: FreeTube Android (Upstream) auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream

      - name: Upstream-Commit merken
        id: up
        run: |
          echo "sha=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Upstream: ${UPSTREAM_REPO}@$(git -C upstream rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Abhängigkeiten installieren
        working-directory: upstream
        run: pnpm i --frozen-lockfile

      - name: Web-Oberfläche für Android packen (webpack)
        working-directory: upstream
        run: pnpm run pack:android

      - name: Fire-TV-Patches anwenden
        run: |
          v="${{ steps.ref.outputs.version }}"
          python3 firetv/apply-firetv.py upstream ${v:+--version "$v"}

      - name: Version auslesen
        id: ver
        run: echo "version=$(node -p "require('./upstream/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Feste Signatur einrichten (falls Secret vorhanden)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Kein KEYSTORE_B64-Secret – APK wird mit wechselndem Debug-Schlüssel signiert. Updates erfordern dann Deinstallation (siehe README)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > upstream/freetube-tv.keystore
          f=upstream/android/app/build.gradle.kts
          # Upstream hat dafür einen Platzhalter im "debug"-signingConfig
          sed -i "s@// inject signing config@storeFile = file(\"../../freetube-tv.keystore\")\n        storePassword = \"${KEYSTORE_PASSWORD}\"\n        keyAlias = \"${KEY_ALIAS:-freetubetv}\"\n        keyPassword = \"${KEYSTORE_PASSWORD}\"@" "$f"
          echo "Signatur aus Secret eingerichtet."

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: APK bauen (Release)
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Lint auf API-28-Kompatibilität prüfen
        working-directory: upstream/android
        continue-on-error: true
        run: |
          ./gradlew lintRelease --no-daemon || true
          r=$(ls app/build/reports/lint-results-release.xml 2>/dev/null || true)
          if [ -n "$r" ] && grep -q 'id="NewApi"' "$r"; then
            echo "::warning::Lint meldet NewApi-Stellen (Aufrufe > API 28). Details im Artefakt lint-report."
            grep -o 'message="[^"]*"' "$r" | grep -i "api level" | sort -u | head -30
          else
            echo "Keine NewApi-Meldungen – kompatibel mit Fire OS 7 (API 28)."
          fi

      - name: APK umbenennen + Prüfsumme
        run: |
          mkdir -p dist
          apk="dist/FreeTubeTV-${{ steps.ver.outputs.version }}.apk"
          cp upstream/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Kopie mit festem Namen -> feste Download-URL für die Downloader-App:
          # https://github.com/<user>/<repo>/releases/latest/download/FreeTubeTV-latest.apk
          cp "$apk" dist/FreeTubeTV-latest.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "APK: \`$(basename "$apk")\` (Upstream ${{ steps.up.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FreeTubeTV-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: upstream/android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      # Bei JEDEM Lauf (Push, "Run workflow" oder Tag) ein Release anlegen.
      # Ohne eigenen Tag wird v<version> (enthält die Laufnummer) automatisch erzeugt.
      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          # Tag pro Lauf eindeutig (Release = Upstream-Version + Kit-Build-Nummer)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-tv{1}', steps.ver.outputs.version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: FreeTube TV ${{ steps.ver.outputs.version }} (Build ${{ github.run_number }})
          make_latest: "true"
          files: dist/*
          body: |
            FreeTube TV für Amazon Fire TV (Fire OS 7 / Android 9, 32-bit).
            Basis: ${{ env.UPSTREAM_REPO }}@${{ steps.up.outputs.sha }}

            **Download:** `FreeTubeTV-${{ steps.ver.outputs.version }}.apk`
            (identisch mit `FreeTubeTV-latest.apk`, das immer auf die neueste Version zeigt).

            Feste URL für die Downloader-App am Fire TV:
            https://github.com/${{ github.repository }}/releases/latest/download/FreeTubeTV-latest.apk

            Installation: siehe ANLEITUNG-INSTALLATION.md
